<section class="space-y-4">
  <label
    class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed px-4 py-10 text-center transition"
    [class.border-cyan-400]="dragging()"
    [class.bg-cyan-500/10]="dragging()"
    [class.border-slate-700]="!dragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <input class="hidden" type="file" multiple accept=".pdf,.txt,.md,.csv,.json,.docx" (change)="onSelect($event)" />
    <p class="text-sm font-medium">Drop documents here</p>
    <p class="mt-1 text-xs text-slate-400">PDF, TXT, MD. Upload goes straight to S3 via a pre-signed URL.</p>
  </label>

  @if (status()) {
    <p class="text-sm text-cyan-300">{{ status() }}</p>
  }
  @if (error()) {
    <p class="text-sm text-rose-400">{{ error() }}</p>
  }

  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-medium text-slate-300">Documents</h3>
      <button class="text-xs text-slate-400 hover:text-white" type="button" (click)="refresh()">Refresh</button>
    </div>
    @for (doc of documents(); track doc.id) {
      <article class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">
        <div class="flex items-center justify-between gap-2">
          <p class="truncate text-sm">{{ doc.filename }}</p>
          <span class="rounded-full bg-slate-800 px-2 py-0.5 text-[11px] uppercase">{{ doc.status }}</span>
        </div>
        @if (doc.error) {
          <p class="mt-1 text-xs text-rose-400">{{ doc.error }}</p>
        }
      </article>
    } @empty {
      <p class="text-sm text-slate-500">No files ingested yet.</p>
    }
  </div>
</section>
